name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests with 85% coverage gate
        run: npm run test:coverage

  canary-rehearsal:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Healthy canary must be promoted
        run: npm run canary
      - name: Chaos canary must be rolled back
        run: |
          if npm run canary:chaos; then
            echo "Rollback logic is broken: a bad canary was promoted"; exit 1
          fi
          echo "Rollback logic verified."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker-smoke:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shipgate:ci --build-arg APP_VERSION=${{ github.sha }} .
      - run: docker run -d --name app -p 3000:3000 shipgate:ci
      - run: ./scripts/smoke-test.sh http://localhost:3000
      - if: failure()
        run: docker logs app
